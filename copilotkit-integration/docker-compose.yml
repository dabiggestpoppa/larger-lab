version: '3.8'

services:
  hermes-agent:
    build: .
    container_name: hermes-agent
    ports:
      - "3000:3000"
    volumes:
      - ./agent_state.json:/app/agent_state.json
      - ../.env:/app/.env:ro
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    restart: unless-stopped