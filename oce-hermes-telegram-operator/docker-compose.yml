# OCE Hermes Telegram Operator — Docker Compose
# Local-only deployment with security hardening
# No public ports. Long polling only.

services:
  # ─── OCE MCP Facade ──────────────────────────────────────────────────────
  oce-mcp-facade:
    build:
      context: .
      dockerfile: docker/Dockerfile.facade
    container_name: oce-mcp-facade
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - oce-internal
    ports:
      - "127.0.0.1:9090:9090"  # Only localhost
    environment:
      - OCE_BACKEND_URL=http://host.docker.internal:8000
      - OCE_SERVICE_TOKEN=${OCE_SERVICE_TOKEN}
      - OCE_REQUEST_TIMEOUT=30
      - RATE_LIMIT_PER_MINUTE=60
      - LOG_LEVEL=INFO
      - AUDIT_LOG_PATH=/data/audit/audit.jsonl
    volumes:
      - facade-audit:/data/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Hermes Agent ────────────────────────────────────────────────────────
  hermes-operator:
    build:
      context: .
      dockerfile: docker/Dockerfile.hermes
    container_name: hermes-operator
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - oce-internal
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_ALLOW_ALL_USERS=false
      - HERMES_PROFILE=oce-operator
      - HERMES_CONFIG=/config/config.yaml
    volumes:
      - hermes-data:/home/hermes/.hermes
      - hermes-config:/config
    depends_on:
      oce-mcp-facade:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  oce-internal:
    driver: bridge
    internal: true  # No external access

volumes:
  facade-audit:
    driver: local
  hermes-data:
    driver: local
  hermes-config:
    driver: local
