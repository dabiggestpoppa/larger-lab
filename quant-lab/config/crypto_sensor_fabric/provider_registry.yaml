# PROVIDER REGISTRY — frozen candidate set from bloc_01/02 §12-13 and
# bloc_01/04 §4 (frozen provider candidate set for first fabric build).
#
# Doctrine:
#   - No provider is canonical truth; providers are interchangeable evidence
#     sources beneath canonical contracts.
#   - `claimed` capability is a planning claim only.  `verified` stays false
#     until Bloc 2 capability probes prove actual free access, history depth,
#     units and semantics.
#   - Bloc 1 does NOT mark historical access verified.
#   - Fallback candidates improve ECONOMIC SENSOR COVERAGE; they never
#     rewrite history by pretending another venue is the missing venue.
#
# Status vocabulary: CANDIDATE | ACTIVE | DEMOTED | EXCLUDED
schema_version: "1.0"

providers:
  KRAKEN_FUTURES:
    evidence_class: FIRST_PARTY_EXCHANGE
    status: CANDIDATE
    access:
      access_class: UNVERIFIED
      verified_at: null
      verification_method: null
      cost_usd_required: 0
      payment_method_required: false
      staking_required: false
      transaction_required: false
      api_key_required: null
      rate_limit: null
      historical_access_claimed: true
      historical_access_verified: false
      terms_reference: null
    capabilities:
      liquidations:
        claimed: true
        verified: false
        equivalence_default: NORMALIZABLE_COMPARABLE
      open_interest:
        claimed: true
        verified: false
      funding:
        claimed: true
        verified: false
      order_flow:
        claimed: true
        verified: false
      order_book:
        claimed: true
        verified: false
    fallback_candidates:
      liquidations: [GATE_FUTURES, DERIBIT, COINALYZE, BITFINEX_COMMUNITY_ARCHIVE]
      open_interest: [BYBIT_LINEAR, GATE_FUTURES, BINANCE_USDM, COINALYZE]
      funding: [BYBIT_LINEAR, GATE_FUTURES, BINANCE_USDM, OKX_SWAP, DERIBIT, COINALYZE]
