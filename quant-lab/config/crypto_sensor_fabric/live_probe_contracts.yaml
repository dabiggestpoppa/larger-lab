# LIVE-PROBE CONTRACT MANIFEST — SENSOR-B2-I12R1C
#
# Operator-readable plan for SENSOR-B2-I13 live probing.  It records, for every
# planned provider/sensor pair, the DOCUMENTED endpoint/query contract that the
# live probe MUST respect so a wrong URL/unit/timestamp/pagination/access
# assumption can never masquerade as provider capability evidence.
#
# Source authority order (per provider/sensor):
#   1. frozen Bloc 2 provider playbook (bloc_02/02_PROVIDER_PROBE_PLAYBOOK.md)
#   2. current first-party provider documentation (evidence_url below)
#   3. lightweight endpoint smoke ONLY after this manifest is reviewed
#   4. secondary/community material only where explicitly allowed
#
# `live_probe_enabled` is FALSE for every row: I13 is NOT authorized yet.  Docs
# verification is NOT live verification and nothing here is promoted.

schema_version: "1.0"
generated_at_checkpoint: SENSOR-B2-I12R1C
documentation_reviewed_on: "2026-08-30"
primary_rule: >
  WRONG REQUEST != PROVIDER UNSUPPORTED.  An incorrect URL, unit, timestamp,
  pagination rule or access assumption must never create provider evidence.
  Only an actual provider response can establish AUTH_BLOCKED or a capability;
  a missing LOCAL free key is classified CREDENTIAL_NOT_CONFIGURED (a run
  prerequisite), never a provider failure.

