# Hermes Configuration
# Source of truth for model choice, terminal backend, tool enablement, MCP servers
# Updated: 2026-05-22 — Hermes v0.14.0 (2026.5.16)

model:
  default: "openrouter/owl-alpha"
  fallback: "openai/gpt-4o"

terminal:
  backend: "cmd"
  shell: "powershell"

tools:
  enabled:
    - hermes_ask
    - hermes_cron
    - hermes_memory
    - hermes_skill

mcp:
  servers:
    - name: "claude-hermes-mcp"
      command: "python"
      args: ["tools/claude_hermes_mcp.py", "serve"]
      port: 8765

gateway:
  port: 8642
  host: "127.0.0.1"

# Hermes v0.14.0 new features
curator:
  enabled: true
  cycle_days: 7
  model: "openrouter/owl-alpha"

prompt_caching:
  cache_ttl: "5m"

redaction:
  enabled: false
