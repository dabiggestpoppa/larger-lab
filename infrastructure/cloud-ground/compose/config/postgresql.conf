# OCE Cloud Ground — PostgreSQL Configuration
# B1-I1 — Static skeleton
# Based on PostgreSQL 16.4 default configuration
# Tuned for single-operator workload (12-core, 32 GB RAM)

# Connection settings
listen_addresses = '*'  # Internal Docker network only
port = 5432
max_connections = 100

# Memory settings (tuned for 8 GB container limit)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 512MB

# WAL settings (for 15-minute RPO target)
wal_level = replica
max_wal_size = 2GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 64MB
synchronous_commit = on

# Write-ahead log for backup
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f'

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
