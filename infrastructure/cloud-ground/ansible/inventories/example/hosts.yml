# Example Inventory for OCE Cloud Ground
# B1-I1 — ALL VALUES ARE PLACEHOLDERS
# DO NOT use real IP addresses, hostnames, or credentials

---
all:
  children:
    control_plane:
      hosts:
        oce-cp-01:
          ansible_host: "{{ OCE_CONTROL_PLANE_IP }}"  # REPLACE: e.g., 192.168.1.100 or Tailscale IP
          ansible_user: oce-operator
          ansible_port: 22
          oce_role: control_plane
          oce_os: ubuntu-24.04-lts
          oce_provider: netcup
          oce_plan: rs-4000-g12

    workers_local:
      hosts:
        oce-worker-local:
          ansible_host: "{{ OCE_LOCAL_WORKER_IP }}"  # REPLACE: operator machine Tailscale IP
          ansible_user: "{{ OCE_LOCAL_USER }}"        # REPLACE: operator username
          oce_role: worker_local
          oce_worker_class: local

  vars:
    ansible_python_interpreter: /usr/bin/python3
    oce_private_network: tailscale
    oce_compose_project: oce-foundation
    oce_postgres_version: "16.4"
    oce_redis_version: "7.4"
    oce_backup_retention_days: 30
    oce_log_retention_days: 30
