---
# Host manifest role — collect host state for audit trail
# B1-I1R — Handles missing variables gracefully

- name: Collect host information
  ansible.builtin.set_fact:
    host_manifest:
      collected_at: "{{ ansible_date_time.iso8601 | default('unknown') }}"
      hostname: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('unknown') }}"
      kernel: "{{ ansible_kernel | default('unknown') }}"
      architecture: "{{ ansible_architecture | default('unknown') }}"
      cpu_cores: "{{ ansible_processor_vcpus | default(0) }}"
      memory_mb: "{{ ansible_memtotal_mb | default(0) }}"
      docker_version: "{{ docker_info.version.Version | default('not-installed') }}"
      compose_version: "{{ docker_compose_version.stdout | default('not-installed') }}"
      tailscale_version: "{{ tailscale_status.stdout_lines[0] | default('not-installed') }}"
  tags: [manifest]

- name: Write host manifest
  ansible.builtin.copy:
    dest: /opt/oce/config/host-manifest.json
    content: "{{ host_manifest | to_nice_json }}"
    owner: root
    group: oce-operator
    mode: '0644'
    remote_src: true
  tags: [manifest]

- name: Display host manifest
  ansible.builtin.debug:
    var: host_manifest
  tags: [manifest]
