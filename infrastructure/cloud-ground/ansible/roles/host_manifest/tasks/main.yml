---
# Host manifest role — collect host state for audit trail
# B1-I1 — Static skeleton

- name: Collect host information
  ansible.builtin.set_fact:
    host_manifest:
      collected_at: "{{ ansible_date_time.iso8601 }}"
      hostname: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
      kernel: "{{ ansible_kernel }}"
      architecture: "{{ ansible_architecture }}"
      cpu_cores: "{{ ansible_processor_vcpus }}"
      memory_mb: "{{ ansible_memtotal_mb }}"
      disk_total_gb: "{{ (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_total') | first / 1073741824) | round(1) }}"
      docker_version: "{{ docker_info.version.Version | default('unknown') }}"
      compose_version: "{{ docker_compose_version.stdout | default('unknown') }}"
      tailscale_version: "{{ tailscale_status.stdout_lines[0] | default('unknown') }}"
      restic_version: "{{ restic_version.stdout | default('unknown') }}"
  tags: [manifest]

- name: Write host manifest
  ansible.builtin.copy:
    dest: /opt/oce/config/host-manifest.json
    content: "{{ host_manifest | to_nice_json }}"
    owner: root
    group: oce-operator
    mode: '0644'
  tags: [manifest]

- name: Display host manifest
  ansible.builtin.debug:
    var: host_manifest
  tags: [manifest]
