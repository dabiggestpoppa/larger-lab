---
# Storage layout role — create directory structure
# B1-I1 — Static skeleton

- name: Create OCE base directory
  ansible.builtin.file:
    path: /opt/oce
    state: directory
    owner: root
    group: oce-operator
    mode: '0755'
  tags: [storage]

- name: Create OCE subdirectories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: oce-operator
    mode: '0755'
  loop:
    - /opt/oce/data
    - /opt/oce/data/postgres
    - /opt/oce/data/redis
    - /opt/oce/data/observability
    - /opt/oce/compose
    - /opt/oce/config
    - /opt/oce/secrets
    - /opt/oce/logs
    - /opt/oce/backups
    - /opt/oce/backups/db
    - /opt/oce/backups/files
    - /opt/oce/staging
    - /opt/oce/staging/artifacts
  tags: [storage]

- name: Set ownership on data directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: docker
    mode: '0775'
    recurse: false
  loop:
    - /opt/oce/data/postgres
    - /opt/oce/data/redis
    - /opt/oce/staging/artifacts
  tags: [storage]

- name: Configure logrotate for OCE logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/oce
    content: |
      /opt/oce/logs/*.log {
          daily
          rotate 30
          compress
          delaycompress
          missingok
          notifempty
          create 0640 root docker
      }
    mode: '0644'
  tags: [storage, logrotate]

- name: Reserve emergency disk headroom (10 GB)
  ansible.builtin.command: >
    fallocate -l 10G /opt/oce/.disk-headroom
  args:
    creates: /opt/oce/.disk-headroom
  tags: [storage, headroom]
