---
# Security role — SSH hardening and firewall
# B1-I1R — Repaired for operator safety
#
# SAFETY: This role MUST NOT lock out the operator.
# Password auth is disabled ONLY after key-based access is verified.
# Firewall changes happen ONLY after access preflight passes.

# === PREFLIGHT: Verify we can still access after changes ===
- name: Preflight — verify SSH key exists
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: ssh_key_stat
  tags: [security, preflight]

- name: Preflight — fail if no SSH key configured
  ansible.builtin.fail:
    msg: >
      ABORT: No SSH authorized_keys found for {{ ansible_user }}.
      Cannot safely disable password auth without key-based access.
      Configure SSH keys first, then re-run this role.
  when: not ssh_key_stat.stat.exists
  tags: [security, preflight]

- name: Preflight — verify current user has sudo access
  ansible.builtin.command: sudo -n true
  register: sudo_test
  ignore_errors: true
  changed_when: false
  tags: [security, preflight]

- name: Preflight — warn if passwordless sudo not yet configured
  ansible.builtin.debug:
    msg: >
      WARNING: Passwordless sudo not yet configured.
      The sudo hardening task will run, but verify access after.
  when: sudo_test.rc != 0
  tags: [security, preflight]

# === SSH HARDENING ===
- name: Detect SSH service name
  ansible.builtin.set_fact:
    ssh_service_name: "{{ 'ssh' if ansible_distribution_version is version('22.04', '>=') else 'sshd' }}"
  tags: [security, ssh]

- name: Harden SSH configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "sshd -t -f %s"
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
  notify: restart ssh
  tags: [security, ssh]

# NOTE: PasswordAuthentication is intentionally NOT disabled here.
# It should only be disabled after the operator has verified key-based
# access works. This is a deliberate safety measure.
- name: Document SSH hardening status
  ansible.builtin.debug:
    msg: >
      SSH hardened: PermitRootLogin=no, X11Forwarding=no, MaxAuthTries=3.
      PasswordAuthentication is still enabled — disable manually after
      verifying key-based access works.
  tags: [security, ssh]

# === FAIL2BAN ===
- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present
  tags: [security, fail2ban]

- name: Enable fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  tags: [security, fail2ban]

# === FIREWALL (UFW) ===
- name: Configure UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny
  tags: [security, firewall]

- name: Configure UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow
  tags: [security, firewall]

# Allow SSH only through Tailscale interface
- name: Allow SSH through Tailscale interface
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "22"
    proto: tcp
  loop:
    - "100.64.0.0/10"  # Tailscale CGNAT range
  tags: [security, firewall, tailscale]

# Allow all traffic through Tailscale interface (for internal services)
- name: Allow all traffic through Tailscale interface
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_interface: tailscale0
  loop:
    - "100.64.0.0/10"
  ignore_errors: true  # tailscale0 may not exist yet
  tags: [security, firewall, tailscale]

- name: Enable UFW
  community.general.ufw:
    state: enabled
  tags: [security, firewall]

# === SUDO HARDENING ===
# Document that passwordless sudo + docker group = root-equivalent authority
- name: Document sudo authority classification
  ansible.builtin.debug:
    msg: >
      SECURITY NOTE: Passwordless sudo and Docker group membership
      are root-equivalent authority. These are appropriate for a
      single-operator control plane but must be documented.
  tags: [security, sudo, authority]

- name: Configure passwordless sudo for operator group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^%sudo'
    line: '%sudo ALL=(ALL:ALL) NOPASSWD:ALL'
    validate: 'visudo -cf %s'
  tags: [security, sudo]
