---
# Docker role — install Docker Engine and Compose plugin
# B1-I1R — Uses safer download practices

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker-archive-keyring.asc
    mode: '0644'
  tags: [docker, install]

- name: Dearmor Docker GPG key
  ansible.builtin.command: gpg --batch --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg /tmp/docker-archive-keyring.asc
  args:
    creates: /usr/share/keyrings/docker-archive-keyring.gpg
  tags: [docker, install]

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  tags: [docker, install]

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: [docker, install]

- name: Ensure Docker is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: [docker, service]

- name: Verify Docker is running
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  tags: [docker, verify]

- name: Verify Docker Compose is available
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false
  tags: [docker, verify]

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "default-address-pools": [
          {"base": "172.18.0.0/16", "size": 24}
        ],
        "live-restore": true,
        "userland-proxy": false
      }
    mode: '0644'
  notify: Restart docker
  tags: [docker, config]

- name: Ensure Docker data directory exists
  ansible.builtin.file:
    path: /opt/oce/docker
    state: directory
    owner: root
    group: docker
    mode: '0755'
  tags: [docker, storage]
