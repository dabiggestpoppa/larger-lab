---
# Tailscale role — install and configure Tailscale
# B1-I1R3A — No broad --accept-routes, explicit interface scoping
#
# WARNING: Auth key must be replaced with actual value during B1-I2
# WARNING: --accept-routes is NOT used — subnet routing requires explicit approval

- name: Detect Ubuntu codename
  ansible.builtin.set_fact:
    ubuntu_codename: "{{ ansible_distribution_release }}"
  tags: [tailscale, detect]

- name: Add Tailscale GPG key
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_codename }}.noarmor.gpg | \
    sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg
  tags: [tailscale, install]

- name: Add Tailscale repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ubuntu_codename }} main"
    state: present
  tags: [tailscale, install]

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  tags: [tailscale, install]

- name: Enable Tailscale service
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  tags: [tailscale, service]

# Authentication: only when a real auth key is provided (not placeholder)
- name: Authenticate Tailscale (without --accept-routes)
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_auth_key }}
    --hostname={{ inventory_hostname }}
  register: tailscale_result
  changed_when: "'Success' in tailscale_result.stdout"
  when:
    - tailscale_auth_key is defined
    - tailscale_auth_key | length > 0
    - not tailscale_auth_key.startswith('tskey-auth-PLACEHOLDER')
  tags: [tailscale, auth]

- name: Document Tailscale authentication status
  ansible.builtin.debug:
    msg: >
      Tailscale auth: {% if tailscale_auth_key is defined and not tailscale_auth_key.startswith('tskey-auth-PLACEHOLDER') %}configured{% else %}PENDING — provide tailscale_auth_key{% endif %}
      --accept-routes: NOT USED (requires explicit operator approval)
  tags: [tailscale, status]

- name: Get Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  ignore_errors: true
  tags: [tailscale, verify]
