version: '3.8'

services:
  hermes-bot:
    build: .
    container_name: hermes-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../:/workspace:ro
    environment:
      - WORKSPACE_PATH=/workspace
      - BOT_TYPE=hermes
    command: python hermes_bot.py

  openclaw-bot:
    build: .
    container_name: openclaw-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../:/workspace:ro
    environment:
      - WORKSPACE_PATH=/workspace
      - BOT_TYPE=openclaw
    command: python openclaw_bot.py