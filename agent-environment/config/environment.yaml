# Agent Virtual Environment Configuration
# ──────────────────────────────────────────

environment:
  name: "Agent Virtual Environment"
  version: "1.0.0"
  host: "localhost"
  port: 9000

# Sandbox settings
sandbox:
  python:
    enabled: true
    timeout_ms: 30000        # 30 second execution limit
    max_output_bytes: 65536  # 64KB output cap
  node:
    enabled: true
    timeout_ms: 30000
    max_output_bytes: 65536
  filesystem:
    workspace_root: "data/workspace"
    max_file_size_bytes: 1048576  # 1MB per file

# Room defaults
rooms:
  defaults:
    - name: "meditation-room"
      description: "IACER thinking space. New agents meditate here before joining the field."
      persistent: true
    - name: "quant-room"
      description: "Quant Lab — strategy work, backtesting, analysis."
      persistent: true
    - name: "chat-room"
      description: "General team chat and coordination."
      persistent: true
    - name: "war-room"
      description: "Mission command — active operations and debugging."
      persistent: true

# Agent defaults
agents:
  max_concurrent: 20
  default_capabilities: ["communicate", "read_files"]
  session_timeout_minutes: 60

# Message bus
messages:
  max_history_per_room: 500
  max_message_length: 4096
