[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "capital-routing"
description = "Capital Routing Research System - Research and backtesting platform for capital routing analysis"
version = "0.1.0"
authors = [
    {name = "Quant Lab", email = "quant@lab.local"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
capital-routing = "capital_routing.cli:main"

[tool.poetry]
name = "capital-routing"
version = "0.1.0"
description = "Capital Routing Research System"
authors = ["Quant Lab <quant@lab.local>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
pyarrow = ">=12.0.0"
jsonschema = ">=4.17.0"
python-dateutil = ">=2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
black = ">=23.0.0"
isort = ">=5.12.0"
mypy = ">=1.0.0"
ruff = ">=0.1.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
skip_gitignore = true
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    ".venv/",
    ".git/",
    ".pytest_cache/",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]
exclude = [
    ".venv/",
    ".git/",
    ".pytest_cache/",
    "build/",
    "dist/",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/" = ["F401"]