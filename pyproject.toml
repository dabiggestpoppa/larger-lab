[project]
name = "quant-lab"
version = "0.1.0"
description = "Quantitative trading research with Nautilus Trader + OANDA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Nautilus Trader (from GitHub)
    "nautilus_trader>=1.226.0",
    # Data & Analysis
    "alpha-vantage>=3.0.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3,<3.0.0",
    "pandas-datareader>=0.10.0",
    "yfinance>=1.3.0",
    # Backtesting
    "backtrader>=1.9.78.123",
    "pyfolio-reloaded>=0.9.7",
    "quantstats>=0.0.81",
    "zipline-reloaded>=3.0.4",
    # Visualization
    "matplotlib>=3.10.9",
    "plotly>=6.7.0",
    "seaborn>=0.13.2",
    # ML/DL
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch",
    "torchaudio",
    "torchvision",
    # Utils
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]
