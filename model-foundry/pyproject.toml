[project]
name = "larger-lab-model-foundry"
version = "0.1.0"
description = "Larger Lab Model Foundry — governed scientific substrate (MF-B0..MF-B4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# No ``addopts``: the authoritative command is `pytest tests -q`, and a baked-in
# ``-q`` turned it into ``-qq``, which suppresses the summary line entirely and
# made the pass count unverifiable from the command the receipts name.
addopts = "-ra"
