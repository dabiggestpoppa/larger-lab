name: Capital Routing CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest jsonschema pytz
    
    - name: Run tests
      run: |
        python -m pytest -q tests/
    
    - name: Run Phase 1
      run: |
        python -c "
        config = {
            'scan_directories': ['data', 'input', 'raw_data', 'sources'],
            'supported_extensions': ['.csv', '.parquet', '.zip'],
            'max_file_size': 100 * 1024 * 1024,
            'canonical_inventory_path': 'canonical_inventory.json',
            'batch_a_queue_path': 'batch_a_queue.json',
            'discovery_report_path': 'discovery_report.json',
        }
        from capital_routing.phases.phase_1 import Phase1DataDiscovery
        p1 = Phase1DataDiscovery(config)
        results = p1.run_phase_1()
        print('Phase 1 completed:', results['status'])
        "
    
    - name: Run Phase 2 (fixture tests only - no real data in CI)
      run: |
        python -c "
        # Phase 2 real data pipeline requires real historical data files
        # which are not available in public CI. Run fixture tests instead.
        from tests.fixtures.synthetic_market_data import create_test_fixture_csv
        from capital_routing.ingestion.normalize import OHLCNormalizer, NormalizationConfig
        import hashlib
        
        # Create test fixture
        fixture_path = create_test_fixture_csv('EURUSD', 'H1', rows=100)
        
        # Calculate checksum
        sha256 = hashlib.sha256()
        with open(fixture_path, 'rb') as f:
            for chunk in iter(lambda: f.read(4096), b''):
                sha256.update(chunk)
        
        config = NormalizationConfig(
            source_file=fixture_path,
            source_sha256=sha256.hexdigest(),
            symbol='EURUSD',
            vendor_symbol='EURUSD',
            timeframe='H1',
            provider='MetaQuotes-Demo',
            price_side='bid',
            source_timezone='UTC',
            output_dir='tests/fixtures/normalized/h1'
        )
        
        normalizer = OHLCNormalizer()
        result = normalizer.normalize(config)
        
        print('Phase 2 fixture test:')
        print('  Success:', result.success)
        print('  Rows:', result.row_count)
        print('  Quality flag:', result.quality_flag)
        print('  Malformed OHLC:', result.malformed_ohlc_count)
        
        if not result.success or result.quality_flag > 1:
            exit(1)
        print('Phase 2 fixture test PASSED')
        "
    
    - name: Run Reality Lock
      run: |
        python -c "
        from capital_routing.backend.reality_lock import ready_for_phase_1, get_failure_reasons
        ready = ready_for_phase_1()
        reasons = get_failure_reasons()
        print('READY_FOR_PHASE_1:', ready)
        print('Reasons:', reasons)
        if not ready:
            exit(1)
        "